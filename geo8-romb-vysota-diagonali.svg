<text x="60" y="56" font-size="28" font-weight="700" font-family="Georgia,serif" fill="#111">Ромб ABCD: a = 20 см, AH = 12 см, BH ⊥ AD</text>
<text x="60" y="92" font-size="21" font-family="Georgia,serif" fill="#555">Высота: BH = √(20² − 12²) = 16 см; HD = 20 − 12 = 8 см</text>
<text x="60" y="848" font-size="21" font-family="Georgia,serif" fill="#2d6cdf">S = a·h = 20·16 = 320 см²</text>
<text x="60" y="882" font-size="21" font-family="Georgia,serif" fill="#c0392b">S = ½·d₁·d₂ = ½·16√5·8√5 = 320 см²  ✓</text>
<text x="60" y="916" font-size="21" font-family="Georgia,serif" fill="#555">Контроль: d₁² + d₂² = 1280 + 320 = 1600 = 4a²  ✓</text>
