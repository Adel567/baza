tured": false}, {"grade": 9, "branch": "Геометрия", "section": "Начальные сведения из стереометрии", "slug": "geo9-stereo-tela-vrascheniya", "label": "Тела вращения: цилиндр, конус, шар", "ready": true, "featured": false}, {"grade": 9, "branch": "Геометрия", "section": "Начальные сведения из стереометрии", "slug": "geo9-stereo-obyom", "label": "Объёмы тел: формулы и вычисление", "ready": true, "featured": false}];
const GRADES = [5,6,7,8,9];
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
let curGrade = +(lsGet('bz-grade')||8), query = "";
if(!GRADES.includes(curGrade)) curGrade = 8;
let onlyReady = lsGet('bz-only-ready')==='1';

const catalog = document.getElementById('catalog');
const nav = document.getElementById('gradeNav');
const qi = document.getElementById('q');

function esc(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderNav(){
  nav.innerHTML = '';
  GRADES.forEach(g=>{
    const b=document.createElement('button');
    b.textContent = g+' класс';
    b.className = (!query && g===curGrade)?'on':'';
    b.onclick=()=>{ curGrade=g; lsSet('bz-grade',g); query=''; qi.value=''; render(); };
    nav.appendChild(b);
  });
  const t=document.createElement('button');
  t.textContent = (onlyReady?'✓ ':'')+'только готовые';
  t.className = 'toggle'+(onlyReady?' on':'');
  t.onclick=()=>{ onlyReady=!onlyReady; lsSet('bz-only-ready', onlyReady?'1':'0'); render(); };
  nav.appendChild(t);
}

function render(){
  renderNav();
  let list = TOPICS;
  const norm=s=>s.toLowerCase().replace(/ё/g,'е');
  if(query){
    const q=norm(query);
    list = TOPICS.filter(t=>norm(t.label).includes(q)||t.slug.includes(q));
  } else {
    list = TOPICS.filter(t=>t.grade===curGrade);
  }
  if(onlyReady) list = list.filter(t=>t.ready);
  catalog.innerHTML='';
  if(!list.length){
    catalog.innerHTML = onlyReady && !query
      ? '<p class="empty">В этом классе пока нет готовых уроков — загляни в соседние классы или сними фильтр.</p>'
      : '<p class="empty">Ничего не нашлось. Попробуй другое слово.</p>';
    return;
  }

  // группировка: ветка -> раздел
  const branches=[];
  list.forEach(t=>{
    const bkey=t.grade+'|'+t.branch;
    let br=branches.find(x=>x.key===bkey);
    if(!br){ br={key:bkey,grade:t.grade,branch:t.branch,secs:[]}; branches.push(br); }
    let sec=br.secs.find(s=>s.title===t.section);
    if(!sec){ sec={title:t.section,items:[]}; br.secs.push(sec); }
    sec.items.push(t);
  });

  branches.forEach(br=>{
    const h=document.createElement('div'); h.className='branch-h';
    h.innerHTML = esc(br.branch)+' <span class="gr">· '+br.grade+' класс</span>';
    catalog.appendChild(h);
    br.secs.forEach(sec=>{
      const sd=document.createElement('div'); sd.className='section';
      sd.innerHTML='<h3>'+esc(sec.title)+'</h3>';
      const lamps=document.createElement('div'); lamps.className='lamps';
      sec.items.forEach(t=>{
        const star = t.featured?'<span class="star">⭐</span>':'';
        if(t.ready){
          const a=document.createElement('a');
          a.className='lamp ready'; a.href='./'+t.slug+'.html';
          a.innerHTML='<span class="bulb"></span><span class="lbl">'+esc(t.label)+'</span>'+star+'<span class="go">▶</span>';
          a.addEventListener('click',()=>lsSet('bz-last', JSON.stringify({slug:t.slug,label:t.label})));
          lamps.appendChild(a);
        } else {
          const d=document.createElement('div');
          d.className='lamp soon';
          d.innerHTML='<span class="bulb"></span><span class="lbl">'+esc(t.label)+'</span>'+star+'<span class="go">скоро</span>';
          lamps.appendChild(d);
        }
      });
      sd.appendChild(lamps); catalog.appendChild(sd);
    });
  });
}

const total=TOPICS.length, readyN=TOPICS.filter(t=>t.ready).length;
document.getElementById('pcount').textContent='Готово '+readyN+' из '+total+' тем';
document.getElementById('pbar').style.width=(readyN/total*100).toFixed(1)+'%';

qi.addEventListener('input',()=>{ query=qi.value.trim(); render(); });

(function(){
  try{
    const v=JSON.parse(lsGet('bz-last')||'null');
    if(v && v.slug && TOPICS.some(t=>t.slug===v.slug && t.ready)){
      document.getElementById('resume').innerHTML =
        '<a class="resume-chip" href="./'+v.slug+'.html">▶ Продолжить: '+esc(v.label)+'</a>';
    }
  }catch(e){}
})();
render();
</script>
